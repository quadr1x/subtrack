name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target.os }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: {os: windows-latest, arch: x64, artifact: windows, name: subtrack-windows-x64, build: 'flutter build windows --release', out_dir: 'build/windows/x64/runner/Release',       archive_format: zip }
          - target: {os: ubuntu-latest, arch: x64,  artifact: web,     name: subtrack-web,         build: 'flutter build web --release',     out_dir: 'build/web',                                archive_format: zip }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Build
        run: ${{ matrix.target.build }}

      - name: Package ${{ matrix.target.name }}
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
          OUT_DIR: ${{ matrix.target.out_dir }}
          ARTIFACT_DIR: ${{ matrix.target.name }}
          ARCHIVE_FMT: ${{ matrix.target.archive_format }}
        run: bash .github/scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: release/${{ matrix.target.name }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -la artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false