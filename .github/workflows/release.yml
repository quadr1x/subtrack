name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target.os }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: {os: ubuntu-latest, arch: x64,  artifact: linux,   name: subtrack-linux-x64,        build: 'flutter build linux --release',           out_dir: 'build/linux/x64/release/bundle', archive_format: tar }
          - target: {os: windows-latest, arch: x64, artifact: windows, name: subtrack-windows-x64,      build: 'flutter build windows --release',         out_dir: 'build/windows/x64/runner/Release', archive_format: zip }
          - target: {os: macos-latest,   arch: arm64,artifact: macos,  name: subtrack-macos-arm64,      build: 'flutter build macos --release',           out_dir: 'build/macos/Build/Products/Release/',      archive_format: tar }
          - target: {os: macos-latest,   arch: x64,  artifact: macos,  name: subtrack-macos-x64,        build: 'flutter build macos --release',           out_dir: 'build/macos/Build/Products/Release/',      archive_format: tar }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux deps
        if: matrix.target.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev libstdc++6 clang cmake ninja-build pkg-config

      - name: Pub get
        run: flutter pub get

      - name: Build
        run: ${{ matrix.target.build }}

      - name: Package ${{ matrix.target.name }}
        shell: bash
        run: |
          set -e
          STAGE="release/${{ matrix.target.name }}"
          rm -rf release
          mkdir -p "$STAGE"

          # Copy the build output into a clean staging directory.
          # The trailing slashes are important: they let cp -R / xcopy
          # copy the *contents* of out_dir into STAGE rather than nesting.
          if [ "${{ runner.os }}" = "Windows_NT" ]; then
            # xcopy returns 0 on success, 1 on "file not found" — we explicitly
            # check that STAGE actually got populated.
            xcopy /E /I /Y "${{ matrix.target.out_dir }}\\*" "$STAGE\" >NUL
          else
            cp -R "${{ matrix.target.out_dir }}/." "$STAGE/"
          fi

          if [ ! -d "$STAGE" ] || [ -z "$(ls -A "$STAGE")" ]; then
            echo "::error::No files were copied into $STAGE"
            exit 1
          fi

          cd release
          if [ "${{ matrix.target.archive_format }}" = "tar" ]; then
            # -h follows symlinks so macOS .app bundles (which contain
            # symlinks in Frameworks/) archive correctly.
            tar -czhf "${{ matrix.target.name }}.tar.gz" "${{ matrix.target.name }}"
          else
            # Use zip -r on Windows. Quote the path to handle spaces.
            zip -r "${{ matrix.target.name }}.zip" "${{ matrix.target.name }}"
          fi
          cd ..
          ls -la release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: release/${{ matrix.target.name }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -la artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
