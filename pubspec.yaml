name: subtrack
description: Offline-first subscription manager for Web and Desktop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

isar_version: &isar_version 3.3.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.2.0

  # Local DB (community fork of Isar 3.x — Web IndexedDB + Desktop)
  isar_community: *isar_version
  isar_community_flutter_libs: *isar_version

  # Hive (used by main app shell for now)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^1.1.1

  # Localization
  easy_localization: ^3.0.8

  # Navigation
  go_router: ^16.2.4

  # Smart Search
  string_similarity: ^2.1.1

  # Files / ids / HTTP
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  collection: ^1.19.1

  # Desktop window + notifications
  window_manager: ^0.5.1
  local_notifier: ^0.1.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Optional PIN
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  isar_community_generator: *isar_version
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/templates/
msix_config:
  display_name: SubTrack
  publisher_display_name: SubTrack Team
  title: SubTrack Manager
  description: Smart cross-platform subscription manager.
  identity_name: com.subtrack.app
  version: 1.0.0.0
  architecture: x64
